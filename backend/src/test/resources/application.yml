spring:
  datasource:
    url: jdbc:h2:mem:hotelpoo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: chave-de-teste-com-pelo-menos-32-caracteres
    expiration-hours: 1
