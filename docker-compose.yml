services:
  postgres:
    image: postgres:16
    container_name: hotelpoo-postgres
    environment:
      POSTGRES_DB: hotelpoo
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    volumes:
      - hotelpoo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotelpoo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotelpoo_pgdata:
